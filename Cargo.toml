[workspace]
resolver = "2"
members = [
    "crates/washi-ivec",
    "crates/washi-net",
    "crates/washi-core",
    "crates/washi",
    "crates/washi-fake",
    "crates/washid",
    "crates/washi-gui",
]

[workspace.package]
version = "0.1.5"
edition = "2024"
authors = ["JenAriDev"]
repository = "https://github.com/Jenari-Dev/washi"
homepage = "https://github.com/Jenari-Dev/washi"
rust-version = "1.85"
license = "GPL-2.0-or-later"

[workspace.dependencies]
washi-ivec = { path = "crates/washi-ivec" }
washi-net = { path = "crates/washi-net" }
washi-core = { path = "crates/washi-core" }
washi-fake = { path = "crates/washi-fake" }
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.41"
uuid = { version = "1", features = ["v4"] }
mdns-sd = "0.21"
toml = "1"
dirs = "7"
tempfile = "3"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
zbus = { version = "5.13.2", default-features = false, features = ["tokio"] }
