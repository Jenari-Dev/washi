name: Release

# Runs when a tag such as v0.1.1 is pushed: builds the Arch package and the Flatpak bundle and
# publishes a GitHub release with both.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  arch-package:
    name: Arch package
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel diffutils git rust gettext \
            qt6-base qt6-declarative qt6-svg ki18n poppler dbus hicolor-icon-theme \
            noto-fonts

      - uses: actions/checkout@v7.0.1

      - name: The tag matches the PKGBUILD
        run: |
          pkgver=$(sed -n 's/^pkgver=//p' packaging/arch/PKGBUILD)
          if [ "v$pkgver" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match pkgver $pkgver in packaging/arch/PKGBUILD" >&2
            exit 1
          fi

      - name: Build as a normal user from the tagged tarball
        run: |
          useradd -m builder
          chown -R builder:builder .
          su builder -c 'cd packaging/arch && makepkg --noconfirm --clean'
          ls -l packaging/arch/*.pkg.tar.zst

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: arch-package
          path: packaging/arch/*.pkg.tar.zst
          if-no-files-found: error

  flatpak:
    name: Flatpak bundle
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.11
      options: --privileged
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Version and cargo sources
        id: version
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          python3 tools/flatpak-cargo-sources.py

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6.8
        with:
          bundle: Washi-${{ steps.version.outputs.version }}-x86_64.flatpak
          manifest-path: packaging/flatpak/io.github.Jenari_Dev.Washi.yml
          arch: x86_64
          cache-key: flatpak-builder-${{ github.sha }}
          upload-artifact: false

      - name: Smoke test the bundle (install it, run washi, washid and the app)
        run: sh tools/flatpak-smoke.sh Washi-*.flatpak

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: flatpak-bundle
          path: Washi-*.flatpak
          if-no-files-found: error

  release:
    name: GitHub release
    needs: [arch-package, flatpak]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/download-artifact@v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Release notes from the changelog
        run: |
          version=${GITHUB_REF_NAME#v}
          # The section of CHANGELOG.md for this version.
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "no section for $version in CHANGELOG.md" >&2
            exit 1
          fi
          {
            echo
            echo "### Install"
            echo
            echo "- Arch Linux: \`sudo pacman -U washi-$version-1-x86_64.pkg.tar.zst\`"
            echo "- Flatpak: \`flatpak install --user Washi-$version-x86_64.flatpak\` (needs the KDE 6.11 runtime from Flathub)"
            echo
            echo "See the README for details. Washi is an independent project and is not affiliated with Canon Inc."
          } >> notes.md
          (cd dist && sha256sum * > SHA256SUMS)
          cat notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          gh release create "$GITHUB_REF_NAME" \
            --title "Washi $version" \
            --notes-file notes.md \
            dist/*
